[package]
name = "codex-android-jni"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]
exclude = ["build-upstream/codex-rs"]

[lib]
name = "codex_android_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
codex-app-server = { path = "build-upstream/codex-rs/app-server" }
codex-app-server-protocol = { path = "build-upstream/codex-rs/app-server-protocol" }
codex-arg0 = { path = "build-upstream/codex-rs/arg0" }
codex-config = { path = "build-upstream/codex-rs/config" }
codex-core = { path = "build-upstream/codex-rs/core" }
codex-exec-server = { path = "build-upstream/codex-rs/exec-server" }
codex-feedback = { path = "build-upstream/codex-rs/feedback" }
codex-protocol = { path = "build-upstream/codex-rs/protocol" }
codex-shell-command = { path = "build-upstream/codex-rs/shell-command" }
codex-utils-path-uri = { path = "build-upstream/codex-rs/utils/path-uri" }
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "0.9"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
debug = 0
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
